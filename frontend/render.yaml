# Render blueprint.
#
# Render reads this from the REPOSITORY ROOT. If this file sits one folder deep
# (e.g. omnicraft/render.yaml), move it up or set each service's rootDir to
# match, otherwise Render won't find it.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: omnicraft-api
    runtime: docker
    # Docker is used rather than the native Python runtime because the media
    # modules need ffmpeg, fpcalc and espeak-ng installed at the system level.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates and stores a random one
      - key: ENVIRONMENT
        value: production
      - key: LOCAL_STORAGE_PATH
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: omnicraft-db
          property: connectionString
      # Set this to your deployed frontend origin, or the browser will be
      # blocked by CORS on every request.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Optional provider keys. Every one of these can stay empty - the module
      # that needs it reports itself unavailable instead of crashing.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: REPLICATE_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ACOUSTID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      # Renders, uploads and the SQLite file live here. Without a disk the
      # library is wiped on every deploy.
      name: omnicraft-media
      mountPath: /data
      sizeGB: 5

databases:
  - name: omnicraft-db
    plan: free
    databaseName: omnicraft
    user: omnicraft
